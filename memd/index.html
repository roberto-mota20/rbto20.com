<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="memd — Publicações, artigos e notas técnicas em Markdown e MDX." />

  <title>memd — Publicações</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="../assets/pfp.jpg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div class="site-wrapper memd-wrapper">
    <main class="content-frame memd-frame" role="main">

      <!-- Navigation Header -->
      <header class="privacy-header memd-header">
        <div class="memd-brand">
          <a href="../index.html" class="memd-home-link" aria-label="Página Inicial">
            <span class="memd-logo">memd</span>
          </a>
          <span class="memd-breadcrumb-sep" id="breadcrumb-sep" style="display: none;">/</span>
          <span class="memd-breadcrumb-current" id="breadcrumb-current" style="display: none;"></span>
        </div>

        <div class="memd-nav-actions">
          <button type="button" class="btn-exit" id="btn-memd-back" aria-label="Voltar" style="display: none;">
            <span class="btn-exit-icon">←</span>
            <span>Publicações</span>
          </button>
          <a href="../index.html" class="btn-exit" id="btn-home-back" aria-label="Voltar para início">
            <span class="btn-exit-icon">←</span>
            <span>Início</span>
          </a>
        </div>
      </header>

      <!-- View: Publications List -->
      <section id="view-list" class="memd-view">
        <div class="memd-intro">
          <h1 class="header-name">Publicações</h1>
          <p class="memd-subtitle">Notas, artigos e experimentos em Markdown e MDX.</p>
        </div>

        <!-- Filter / Search (Subtle) -->
        <div class="memd-search-box" id="search-container" style="display: none;">
          <input type="text" id="memd-search-input" class="memd-search-input" placeholder="buscar publicação..."
            aria-label="Buscar publicação" autocomplete="off" />
        </div>

        <!-- List Container -->
        <div id="posts-container" class="memd-posts-list">
          <!-- Loading state -->
          <div class="memd-loading" id="posts-loading">
            <span class="memd-spinner"></span>
            <span>Carregando publicações...</span>
          </div>
        </div>
      </section>

      <!-- View: Single Post Reader -->
      <article id="view-post" class="memd-view" style="display: none;">
        <div class="memd-article-header" id="post-header">
          <div class="memd-post-meta" id="post-meta-top">
            <time id="post-date" class="memd-date"></time>
            <span class="memd-dot">•</span>
            <span id="post-read-time" class="memd-read-time"></span>
          </div>
          <h1 class="memd-post-title" id="post-title"></h1>
          <div class="memd-tags-list" id="post-tags"></div>
        </div>

        <div class="markdown-body" id="post-content">
          <!-- Markdown rendered content goes here -->
        </div>

        <footer class="memd-article-footer">
          <button type="button" class="btn-exit" id="btn-footer-back">
            <span class="btn-exit-icon">←</span>
            <span>Voltar para as publicações</span>
          </button>
          <a href="#" class="privacy-link" id="btn-back-to-top">↑ topo</a>
        </footer>
      </article>

      <!-- Error / Empty State -->
      <div id="view-error" class="memd-view" style="display: none;">
        <div class="privacy-body">
          <p id="error-message">Publicação não encontrada.</p>
          <div class="privacy-links-group">
            <button type="button" class="action-btn" id="btn-error-back">
              ← Ver todas as publicações
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Corner Footer Link -->
    <div class="corner-privacy">
      <a href="../privacidade.html" class="privacy-link" id="link-privacy">
        privacidade
      </a>
    </div>
  </div>

  <!-- Markdown Parser Script -->
  <script>
    (function () {
      'use strict';

      // State
      let manifest = [];
      let currentPostSlug = null;

      // DOM Elements
      const viewList = document.getElementById('view-list');
      const viewPost = document.getElementById('view-post');
      const viewError = document.getElementById('view-error');
      const postsContainer = document.getElementById('posts-container');
      const searchContainer = document.getElementById('search-container');
      const searchInput = document.getElementById('memd-search-input');
      const btnMemdBack = document.getElementById('btn-memd-back');
      const btnHomeBack = document.getElementById('btn-home-back');
      const btnFooterBack = document.getElementById('btn-footer-back');
      const btnErrorBack = document.getElementById('btn-error-back');
      const btnBackToTop = document.getElementById('btn-back-to-top');
      const breadcrumbSep = document.getElementById('breadcrumb-sep');
      const breadcrumbCurrent = document.getElementById('breadcrumb-current');

      const postTitle = document.getElementById('post-title');
      const postDate = document.getElementById('post-date');
      const postReadTime = document.getElementById('post-read-time');
      const postTags = document.getElementById('post-tags');
      const postContent = document.getElementById('post-content');
      const errorMessage = document.getElementById('error-message');

      // Date Formatter (pt-BR)
      function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const year = parts[0];
          const monthIndex = parseInt(parts[1], 10) - 1;
          const day = parseInt(parts[2], 10);
          const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
          const monthName = months[monthIndex] || parts[1];
          return `${day < 10 ? '0' + day : day} ${monthName} ${year}`;
        }
        return dateStr;
      }

      // Reading Time Calculation
      function calculateReadTime(text) {
        const words = text.trim().split(/\s+/).length;
        const minutes = Math.max(1, Math.ceil(words / 200));
        return `${minutes} min de leitura`;
      }

      // YAML Frontmatter Parser
      function parseFrontmatter(rawContent) {
        const trimmed = rawContent.trimStart();
        if (!trimmed.startsWith('---')) {
          return { data: {}, content: rawContent };
        }

        const endIndex = trimmed.indexOf('---', 3);
        if (endIndex === -1) {
          return { data: {}, content: rawContent };
        }

        const frontmatterBlock = trimmed.slice(3, endIndex).trim();
        const content = trimmed.slice(endIndex + 3).trim();
        const data = {};

        const lines = frontmatterBlock.split('\n');
        for (const line of lines) {
          const colonPos = line.indexOf(':');
          if (colonPos > 0) {
            const key = line.slice(0, colonPos).trim();
            let value = line.slice(colonPos + 1).trim();

            // Handle arrays: [tag1, tag2]
            if (value.startsWith('[') && value.endsWith(']')) {
              value = value.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
            } else {
              // Strip quotes
              value = value.replace(/^['"]|['"]$/g, '');
            }
            data[key] = value;
          }
        }

        return { data, content };
      }

      // Lightweight, Secure, Native Markdown / MDX Parser
      function renderMarkdown(md) {
        if (!md) return '';

        let html = md;

        // Escape raw HTML entities in text, except code blocks
        // 1. Code blocks with language
        const codeBlocks = [];
        html = html.replace(/```([a-zA-Z0-9_\-]+)?\n([\s\S]*?)```/g, function (match, lang, code) {
          const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
          const cleanLang = lang ? lang.trim() : 'text';
          const escapedCode = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          codeBlocks.push(
            `<div class="code-block-wrapper"><div class="code-block-header"><span class="code-lang">${cleanLang}</span><button type="button" class="btn-copy-code" onclick="copyCode(this)" aria-label="Copiar código">Copiar</button></div><pre><code class="language-${cleanLang}">${escapedCode}</code></pre></div>`
          );
          return placeholder;
        });

        // 2. Inline code
        const inlineCodes = [];
        html = html.replace(/`([^`\n]+)`/g, function (match, code) {
          const placeholder = `__INLINE_CODE_${inlineCodes.length}__`;
          const escaped = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          inlineCodes.push(`<code>${escaped}</code>`);
          return placeholder;
        });

        // 3. Horizontal Rules
        html = html.replace(/^(\*{3,}|-{3,}|_{3,})$/gm, '<hr />');

        // 4. Headers (# to ######)
        html = html.replace(/^###### (.*$)/gm, '<h6 id="$1">$1</h6>');
        html = html.replace(/^##### (.*$)/gm, '<h5 id="$1">$1</h5>');
        html = html.replace(/^#### (.*$)/gm, '<h4 id="$1">$1</h4>');
        html = html.replace(/^### (.*$)/gm, '<h3 id="$1">$1</h3>');
        html = html.replace(/^## (.*$)/gm, '<h2 id="$1">$1</h2>');
        html = html.replace(/^# (.*$)/gm, '<h1 id="$1">$1</h1>');

        // 5. Blockquotes (> text)
        html = html.replace(/^\> (.*$)/gm, '<blockquote><p>$1</p></blockquote>');
        html = html.replace(/<\/blockquote>\n<blockquote>/g, ''); // merge consecutive blockquotes

        // 6. Tables
        html = html.replace(/^(\|.+?\|)\n(\|[-:\s|]+?\|)\n((?:\|.+?\|\n?)+)/gm, function (match, headerRow, alignRow, bodyRows) {
          const headers = headerRow.split('|').slice(1, -1).map(h => `<th>${h.trim()}</th>`).join('');
          const rows = bodyRows.trim().split('\n').map(row => {
            const cells = row.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
            return `<tr>${cells}</tr>`;
          }).join('');
          return `<div class="table-wrapper"><table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
        });

        // 7. Lists
        // Task lists: - [ ] or - [x]
        html = html.replace(/^- \[(x|X)\] (.*$)/gm, '<li class="task-item"><input type="checkbox" checked disabled /> <span>$2</span></li>');
        html = html.replace(/^- \[ \] (.*$)/gm, '<li class="task-item"><input type="checkbox" disabled /> <span>$2</span></li>');

        // Unordered lists (- or *)
        html = html.replace(/^[\*\-] (.*$)/gm, '<li>$1</li>');
        // Ordered lists (1. 2.)
        html = html.replace(/^\d+\. (.*$)/gm, '<li class="ordered-item">$1</li>');

        // Wrap consecutive <li> tags in <ul> or <ol>
        html = html.replace(/((?:<li class="task-item">.*?<\/li>\n?)+)/g, '<ul class="task-list">$1</ul>');
        html = html.replace(/((?:<li class="ordered-item">.*?<\/li>\n?)+)/g, '<ol>$1</ol>');
        html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1</ul>');

        // 8. Bold, Italic, Strikethrough
        html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');
        html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

        // 9. Images ![alt](url)
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="md-image" loading="lazy" />');

        // 10. Links [text](url)
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
          const isExternal = url.startsWith('http://') || url.startsWith('https://');
          const attrs = isExternal ? 'target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${url}" class="text-link" ${attrs}>${text}</a>`;
        });

        // 11. Paragraphs
        const blocks = html.split(/\n\n+/);
        html = blocks.map(block => {
          block = block.trim();
          if (!block) return '';
          if (/^<(h[1-6]|ul|ol|blockquote|div|table|hr|pre)/i.test(block)) {
            return block;
          }
          return `<p>${block.replace(/\n/g, '<br />')}</p>`;
        }).join('\n\n');

        // Restore inline code
        html = html.replace(/__INLINE_CODE_(\d+)__/g, function (match, index) {
          return inlineCodes[Number(index)] || match;
        });

        // Restore code blocks
        html = html.replace(/__CODE_BLOCK_(\d+)__/g, function (match, index) {
          return codeBlocks[Number(index)] || match;
        });

        return html;
      }

      // Copy Code Utility
      window.copyCode = function (btn) {
        const wrapper = btn.closest('.code-block-wrapper');
        const codeElem = wrapper ? wrapper.querySelector('code') : null;
        if (!codeElem) return;

        navigator.clipboard.writeText(codeElem.innerText).then(() => {
          const origText = btn.textContent;
          btn.textContent = 'Copiado!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = origText;
            btn.classList.remove('copied');
          }, 2000);
        });
      };

      // Render Posts List
      function renderList(postsToRender) {
        if (!postsToRender || postsToRender.length === 0) {
          postsContainer.innerHTML = `
            <div class="memd-empty">
              <p>Nenhuma publicação encontrada.</p>
            </div>
          `;
          return;
        }

        postsContainer.innerHTML = postsToRender.map(post => {
          const formattedDate = formatDate(post.date);
          const tagsHtml = (post.tags || []).map(t => `<span class="memd-tag">#${t}</span>`).join('');

          return `
            <article class="memd-card" onclick="window.memdNavigate('${post.slug}')" role="button" tabindex="0" aria-label="Ler ${post.title}">
              <div class="memd-card-header">
                <time class="memd-card-date">${formattedDate}</time>
                <div class="memd-card-tags">${tagsHtml}</div>
              </div>
              <h2 class="memd-card-title">${post.title}</h2>
              ${post.description ? `<p class="memd-card-desc">${post.description}</p>` : ''}
              <div class="memd-card-footer">
                <span class="memd-read-more">ler publicação →</span>
              </div>
            </article>
          `;
        }).join('');

        // Keyboard accessibility for cards
        postsContainer.querySelectorAll('.memd-card').forEach(card => {
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              card.click();
            }
          });
        });
      }

      // Load and Render Single Post
      async function loadPost(slug) {
        showView('loading');
        currentPostSlug = slug;

        // Find in manifest if available
        let manifestEntry = manifest.find(p => p.slug === slug || p.file === slug || p.file === `${slug}.md` || p.file === `${slug}.mdx`);
        let filename = manifestEntry ? manifestEntry.file : `${slug}.md`;

        let rawMarkdown = '';
        let loaded = false;

        // Try to fetch file
        const candidatePaths = [
          `../publicacoes/${filename}`,
          `../publicacoes/${slug}.md`,
          `../publicacoes/${slug}.mdx`,
          `../publicacoes/${slug}`
        ];

        for (const path of candidatePaths) {
          try {
            const res = await fetch(path);
            if (res.ok) {
              rawMarkdown = await res.text();
              loaded = true;
              break;
            }
          } catch (e) {
            // try next
          }
        }

        if (!loaded) {
          showError(`Não foi possível carregar a publicação "${slug}". Arquivo não encontrado.`);
          return;
        }

        const { data: frontmatter, content } = parseFrontmatter(rawMarkdown);

        // Metadata Resolution
        const title = frontmatter.title || (manifestEntry && manifestEntry.title) || slug;
        const date = frontmatter.date || (manifestEntry && manifestEntry.date) || '';
        const tags = frontmatter.tags || (manifestEntry && manifestEntry.tags) || [];
        const readTime = calculateReadTime(content);

        // Update Document Title
        document.title = `${title} — memd`;

        // Fill Post Header
        postTitle.textContent = title;
        postDate.textContent = formatDate(date);
        postDate.style.display = date ? 'inline' : 'none';
        postReadTime.textContent = readTime;

        // Tags
        postTags.innerHTML = (Array.isArray(tags) ? tags : [tags])
          .map(t => `<span class="memd-tag">#${t}</span>`)
          .join('');

        // Render Markdown Body
        postContent.innerHTML = renderMarkdown(content);

        // Update Breadcrumb & Nav
        breadcrumbSep.style.display = 'inline';
        breadcrumbCurrent.style.display = 'inline';
        breadcrumbCurrent.textContent = title;

        btnMemdBack.style.display = 'inline-flex';
        btnHomeBack.style.display = 'none';

        showView('post');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // View Switcher
      function showView(viewName) {
        viewList.style.display = viewName === 'list' ? 'flex' : 'none';
        viewPost.style.display = viewName === 'post' ? 'block' : 'none';
        viewError.style.display = viewName === 'error' ? 'block' : 'none';

        if (viewName === 'list') {
          document.title = 'memd — Publicações';
          breadcrumbSep.style.display = 'none';
          breadcrumbCurrent.style.display = 'none';
          btnMemdBack.style.display = 'none';
          btnHomeBack.style.display = 'inline-flex';
          currentPostSlug = null;
        }
      }

      function showError(msg) {
        errorMessage.textContent = msg || 'Ocorreu um erro ao carregar a página.';
        showView('error');
        btnMemdBack.style.display = 'inline-flex';
        btnHomeBack.style.display = 'none';
      }

      // Router / Navigation Handler
      window.memdNavigate = function (slug) {
        if (slug) {
          const url = new URL(window.location);
          url.searchParams.set('post', slug);
          window.history.pushState({ post: slug }, '', url);
          loadPost(slug);
        } else {
          const url = new URL(window.location);
          url.searchParams.delete('post');
          window.history.pushState({}, '', url);
          showView('list');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      // URL Query Param Checker
      function handleRoute() {
        const urlParams = new URLSearchParams(window.location.search);
        const postParam = urlParams.get('post') || urlParams.get('p');
        const hash = window.location.hash ? window.location.hash.replace(/^#/, '') : null;

        const targetPost = postParam || hash;

        if (targetPost) {
          loadPost(targetPost);
        } else {
          showView('list');
        }
      }

      // Event Listeners
      window.addEventListener('popstate', (e) => {
        if (e.state && e.state.post) {
          loadPost(e.state.post);
        } else {
          handleRoute();
        }
      });

      btnMemdBack.addEventListener('click', () => window.memdNavigate(null));
      btnFooterBack.addEventListener('click', () => window.memdNavigate(null));
      btnErrorBack.addEventListener('click', () => window.memdNavigate(null));

      btnBackToTop.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Filter input
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase().trim();
          if (!query) {
            renderList(manifest);
            return;
          }
          const filtered = manifest.filter(p =>
            (p.title && p.title.toLowerCase().includes(query)) ||
            (p.description && p.description.toLowerCase().includes(query)) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(query)))
          );
          renderList(filtered);
        });
      }

      // Initial Manifest Fetch
      async function init() {
        try {
          const res = await fetch('../publicacoes/manifest.json');
          if (res.ok) {
            manifest = await res.json();
            if (manifest.length > 2 && searchContainer) {
              searchContainer.style.display = 'block';
            }
            renderList(manifest);
          } else {
            // Fallback list with test post
            manifest = [{
              slug: 'bem-vindo-ao-memd',
              title: 'Bem-vindo ao memd',
              date: '2026-09-06',
              description: 'Apresentando o memd, o módulo de publicações em Markdown e MDX.',
              file: 'bem-vindo-ao-memd.md',
              tags: ['memd', 'markdown']
            }];
            renderList(manifest);
          }
        } catch (e) {
          console.warn('Erro ao carregar manifest.json:', e);
          manifest = [{
            slug: 'bem-vindo-ao-memd',
            title: 'Bem-vindo ao memd',
            date: '2026-09-06',
            description: 'Apresentando o memd, o módulo de publicações em Markdown e MDX.',
            file: 'bem-vindo-ao-memd.md',
            tags: ['memd', 'markdown']
          }];
          renderList(manifest);
        }

        // Process route
        handleRoute();
      }

      init();
    })();
  </script>
</body>

</html>
